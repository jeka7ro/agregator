<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="rd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rd-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="url(#rd-bg)" />
  
  <!-- Concentric radar rings -->
  <circle cx="24" cy="24" r="17" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 3" />
  <circle cx="24" cy="24" r="11" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2" />
  <circle cx="24" cy="24" r="5" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5" />

  <!-- Crosshair grid -->
  <line x1="24" y1="6" x2="24" y2="42" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
  <line x1="6" y1="24" x2="42" y2="24" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />

  <!-- Radar sweep sector -->
  <path d="M24 24L38 12A17 17 0 0 0 24 7Z" fill="url(#rd-sweep)" />

  <!-- Glowing order pings on radar -->
  <circle cx="32" cy="18" r="2.2" fill="#38bdf8" />
  <circle cx="16" cy="29" r="1.8" fill="#34d399" />
  <circle cx="30" cy="31" r="2" fill="#fbbf24" />

  <!-- Active pulsing core -->
  <circle cx="24" cy="24" r="3" fill="#ffffff" />
  <circle cx="24" cy="24" r="1.5" fill="#10b981" />
</svg>