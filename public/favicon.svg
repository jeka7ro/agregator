<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rd-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rd-fav-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Rounded squircle badge -->
  <rect width="64" height="64" rx="18" fill="url(#rd-fav-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Concentric radar circles -->
  <circle cx="32" cy="32" r="23" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="32" cy="32" r="15" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5" />
  <circle cx="32" cy="32" r="7" stroke="#34d399" stroke-opacity="0.7" stroke-width="2" />

  <!-- Radar crosshair lines -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5" />
  <line x1="8" y1="32" x2="56" y2="32" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Radar sweep arc -->
  <path d="M32 32L51 16A23 23 0 0 0 32 9Z" fill="url(#rd-fav-sweep)" />

  <!-- Active order signal blips -->
  <circle cx="43" cy="24" r="2.8" fill="#38bdf8" />
  <circle cx="21" cy="39" r="2.2" fill="#34d399" />
  <circle cx="40" cy="41" r="2.4" fill="#fbbf24" />

  <!-- Core Hub Node -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" />
  <circle cx="32" cy="32" r="2" fill="#10b981" />
</svg>